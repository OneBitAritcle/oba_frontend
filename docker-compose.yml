version: '3'
services:
  oba_frontend:
    build: .
    ports:
      - "19006:19006"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost
